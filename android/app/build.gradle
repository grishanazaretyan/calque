plugins { id 'com.android.application' }
android {
    namespace 'ge.planview'
    compileSdk 35
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    defaultConfig {
        applicationId 'ge.planview'
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName '1.14'
    }
    // Signing details live in keystore.properties (not published), next to settings.gradle.
    def ks = new Properties()
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
    signingConfigs {
        release {
            if (ks['storeFile']) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
        debug {
            ndk { abiFilters 'arm64-v8a', 'x86_64' }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint { checkReleaseBuilds false; abortOnError false }
}

