name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Calque.xcodeproj -target Calque -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          
      - name: Errors summary
        if: failure()
        run: grep -E "error:|warning: .*Swift" build.log | sort -u | head -80 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Calque.app Payload/
          zip -qry Calque.ipa Payload
          ls -la Calque.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Calque-ipa
          path: Calque.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
