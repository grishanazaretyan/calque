name: Post release to Telegram

# Each new folder under releases/ (for example releases/android-1.11/) holds the app file
# (.apk or .ipa) and notes.md. Pushing it posts the changelog and the file to the channel.
on:
  push:
    branches: [main]
    paths: ["releases/**"]
  workflow_dispatch:
    inputs:
      folder:
        description: "Release folder to post again (for example releases/android-1.11)"
        required: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ secrets.TELEGRAM_CHAT || '-1004409075826' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check settings
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::error::Add the TELEGRAM_BOT_TOKEN secret in Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Find new release files
        env:
          FOLDER: ${{ inputs.folder }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$FOLDER" ]; then
            ls -1 "$FOLDER"/* > added.txt
          else
            git diff --name-only --diff-filter=A "$BEFORE" HEAD -- releases > added.txt || true
          fi
          cat added.txt

      - name: Post to Telegram
        run: |
          for d in $(xargs -r -n1 dirname < added.txt | sort -u); do
            [ -f "$d/notes.md" ] || continue
            case "$(basename "$d")" in
              android*) tag="#android" ;;
              ios*|ipad*) tag="#ios" ;;
              *) tag="" ;;
            esac
            title=$(head -n1 "$d/notes.md" | sed 's/^# *//')
            # the changelog goes out once, when notes.md is first pushed
            if grep -qx "$d/notes.md" added.txt; then
              { head -c 3900 "$d/notes.md" | sed '1s/^# *//; 1s/^/🆕 /'; echo; echo "$tag"; } > message.txt
              curl -sS --fail-with-body "https://api.telegram.org/bot$TOKEN/sendMessage" \
                --data-urlencode "chat_id=$CHAT" \
                --data-urlencode "text@message.txt" > /dev/null
              echo "sent changelog for $d"
            fi
            grep "^$d/" added.txt | grep -v '/notes.md$' | while read -r f; do
              curl -sS --fail-with-body "https://api.telegram.org/bot$TOKEN/sendDocument" \
                --form-string "chat_id=$CHAT" \
                --form-string "caption=$title $tag" \
                -F "document=@$f" > /dev/null
              echo "sent $f"
            done
          done
