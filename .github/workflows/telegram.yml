name: Post release to Telegram

# Every published GitHub release (Android .apk or iPad .ipa) goes to the Telegram channel:
# first the changelog as a message, then each file attached to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to post again (for example android-1.11)"
        required: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ secrets.TELEGRAM_CHAT }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check settings
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::error::Add the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT secrets in Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Download the release
        run: |
          mkdir files
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,body --jq '.name' > title.txt
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,body --jq '.body' > notes.txt
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D files
          ls -la files

      - name: Send changelog
        run: |
          { echo "🆕 $(cat title.txt)"; echo; cat notes.txt; } | head -c 4000 > message.txt
          curl -sS --fail-with-body "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text@message.txt" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null

      - name: Send files
        run: |
          for f in files/*; do
            curl -sS --fail-with-body "https://api.telegram.org/bot$TOKEN/sendDocument" \
              --form-string "chat_id=$CHAT" \
              --form-string "caption=$(cat title.txt)" \
              -F "document=@$f" > /dev/null
            echo "sent $f"
          done
