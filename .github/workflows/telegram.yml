name: Post release to Telegram

# Each new folder under releases/ (for example releases/android-1.11/) holds the app file
# (.apk or .ipa) and notes.md. Pushing it posts the changelog and the file to the channel.
on:
  push:
    branches: [main]
    paths: ["releases/**"]
  workflow_dispatch:
    inputs:
      folder:
        description: "Release folder to post again (for example releases/android-1.11)"
        required: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ secrets.TELEGRAM_CHAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check settings
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::error::Add the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT secrets in Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Find new releases
        env:
          FOLDER: ${{ inputs.folder }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$FOLDER" ]; then
            echo "$FOLDER" > folders.txt
          else
            git diff --name-only --diff-filter=A "$BEFORE" HEAD -- releases \
              | grep '/notes.md$' | xargs -r -n1 dirname > folders.txt || true
          fi
          cat folders.txt

      - name: Post to Telegram
        run: |
          while read -r d; do
            [ -f "$d/notes.md" ] || continue
            title=$(head -n1 "$d/notes.md" | sed 's/^# *//')
            head -c 4000 "$d/notes.md" | sed '1s/^# *//; 1s/^/🆕 /' > message.txt
            curl -sS --fail-with-body "https://api.telegram.org/bot$TOKEN/sendMessage" \
              --data-urlencode "chat_id=$CHAT" \
              --data-urlencode "text@message.txt" > /dev/null
            for f in "$d"/*; do
              [ "$(basename "$f")" = notes.md ] && continue
              curl -sS --fail-with-body "https://api.telegram.org/bot$TOKEN/sendDocument" \
                --form-string "chat_id=$CHAT" \
                --form-string "caption=$title" \
                -F "document=@$f" > /dev/null
              echo "sent $f"
            done
          done < folders.txt
